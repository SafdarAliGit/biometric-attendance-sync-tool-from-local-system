<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biometric Attendance Sync</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <script>
    // apply theme before first paint
    (function () {
      var t = null;
      try { t = localStorage.getItem('bas-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/core.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/devices.js"></script>
  <script src="/static/js/pages/progress.js"></script>
  <script src="/static/js/pages/punches.js"></script>
  <script src="/static/js/pages/employees.js"></script>
  <script src="/static/js/pages/logs.js"></script>
  <script src="/static/js/pages/stats.js"></script>
  <script src="/static/js/pages/settings.js"></script>
  <script src="/static/js/pages/help.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
